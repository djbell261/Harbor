# Harbor local/dev Docker Compose stack.
# This file is intentionally not a production deployment manifest.
# Production should provide managed PostgreSQL, externalized secrets,
# explicit CORS origins, and SPRING_PROFILES_ACTIVE=prod.
services:
    postgres:
      image: postgres:16
      container_name: harbor-postgres
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-harbor}
        POSTGRES_USER: ${POSTGRES_USER:-postgres}
        POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-harbor-local-password}
      ports:
        - "5434:5432"
      volumes:
        - harbor_postgres_data:/var/lib/postgresql/data

    resource-service:
      build:
        context: ./resource-service
      container_name: harbor-resource-service
      environment:
        SPRING_PROFILES_ACTIVE: docker
        SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/harbor}
        SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
        SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-harbor-local-password}
        HARBOR_SEED_DATA_ENABLED: ${HARBOR_SEED_DATA_ENABLED:-true}
      ports:
        - "8081:8081"
      depends_on:
        - postgres

    prometheus:
      image: prom/prometheus:v2.55.1
      container_name: harbor-prometheus
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
      ports:
        - "9090:9090"
      volumes:
        - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - harbor_prometheus_data:/prometheus
      depends_on:
        - resource-service

    grafana:
      image: grafana/grafana:11.3.1
      container_name: harbor-grafana
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: harbor
      volumes:
        - harbor_grafana_data:/var/lib/grafana
        - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
        - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      depends_on:
        - prometheus

volumes:
    harbor_postgres_data:
    harbor_prometheus_data:
    harbor_grafana_data:
