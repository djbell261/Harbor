spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/harbor}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-init-sql: SET harbor.seed_data.enabled = '${HARBOR_SEED_DATA_ENABLED:true}'

springdoc:
  api-docs:
    enabled: ${HARBOR_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${HARBOR_OPENAPI_ENABLED:true}

harbor:
  cors:
    allowed-origin-patterns: ${HARBOR_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:517*,http://127.0.0.1:517*}
