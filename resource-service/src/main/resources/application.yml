server:
  port: 8081

spring:
  application:
    name: resource-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p service=${spring.application.name} correlationId=%X{correlationId:-none} thread=%t logger=%logger{36} message=%m%n"

harbor:
  verification:
    stale-resource-days: ${HARBOR_STALE_RESOURCE_DAYS:30}
    rate-limit:
      max-submissions: ${HARBOR_VERIFICATION_RATE_LIMIT_MAX_SUBMISSIONS:5}
      window-minutes: ${HARBOR_VERIFICATION_RATE_LIMIT_WINDOW_MINUTES:10}
